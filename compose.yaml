services:
  magicmirror:
    build:
      context: .
      args:
        MAGICMIRROR_VERSION: v2.36.0
        NODE_VERSION: 22.21.1
    init: true
    ports:
      - "127.0.0.1:${MAGICMIRROR_PORT:-8088}:8080"
    environment:
      TZ: Europe/Berlin
      AHA_MUNICIPALITY: ${AHA_MUNICIPALITY}
      AHA_STREET: ${AHA_STREET}
      AHA_HOUSE_NUMBER: ${AHA_HOUSE_NUMBER}
      AHA_HOUSE_NUMBER_SUFFIX: ${AHA_HOUSE_NUMBER_SUFFIX:-}
    volumes:
      - ./config:/opt/magicmirror/config
      - ./modules:/opt/magicmirror/modules
    restart: unless-stopped
